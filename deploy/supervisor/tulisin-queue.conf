; ============================================================================
; Supervisor config untuk queue worker aplikasi Tulisin (Laravel)
; ============================================================================
; PENTING: sesuaikan nilai di bawah dengan server kamu:
;   1. directory : path project di VPS (mis. /var/www/tulisin)
;   2. user      : user web/php-fpm (biasanya www-data)
;   3. command   : nama binary PHP (php, php8.2, php8.3, dst.)
;
; Cara pakai:
;   sudo cp deploy/supervisor/tulisin-queue.conf /etc/supervisor/conf.d/tulisin-queue.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status
; ============================================================================

; --- Worker antrian default (notifikasi, email, dsb. — cepat) ---------------
[program:tulisin-worker]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/tulisin
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/tulisin/storage/logs/worker-default.log
stopwaitsecs=130

; --- Worker antrian exports (render PDF — lama) ------------------------------
[program:tulisin-exports]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=exports --sleep=3 --tries=1 --timeout=600 --max-time=3600
directory=/var/www/tulisin
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/tulisin/storage/logs/worker-exports.log
stopwaitsecs=620
